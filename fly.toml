# fly.toml app configuration file generated for My Second Brain
#
# Replace 'my-second-brain-api' with your exact Fly.io app name if different.

app = 'my-second-brain-api'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
